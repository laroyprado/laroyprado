<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Terminal com stack e status">
  <rect width="1000" height="330" fill="#0b0f14"/>
  <path d="M0 0H1000V36H0Z" fill="#111a22"/>
  <rect x="16" y="13" width="10" height="10" fill="#f43f8e"/><rect x="34" y="13" width="10" height="10" fill="#22d3ee"/><rect x="52" y="13" width="10" height="10" fill="#4b6573"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="80" y="25" font-size="13" fill="#6b8a99">laroyprado@dev: ~</text>
    <g>
      <text x="24" y="76" fill="#6b8a99">$ <tspan fill="#e8f4f8">./stack --listar</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.01s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="24" y="104" fill="#22d3ee">c  c++  java  python  typescript  sql  terraform  docker</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.01s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="24" y="146" fill="#6b8a99">$ <tspan fill="#e8f4f8">./protocolos --listar</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.01s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="24" y="174" fill="#22d3ee">can  spi  ble  ethercat  jms  rest</text>
      <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.01s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="24" y="216" fill="#6b8a99">$ <tspan fill="#e8f4f8">./ambiente --tipo critico</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.01s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="24" y="244" fill="#9fb4bf">[ok] <tspan fill="#22d3ee">tempo real</tspan> · <tspan fill="#22d3ee">sem parada</tspan> · <tspan fill="#22d3ee">implantação em campo</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.01s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="24" y="292" fill="#6b8a99">$ <tspan fill="#e8f4f8">./status</tspan></text>
      <text x="24" y="318" fill="#f43f8e">disponível para vagas remotas e projetos</text>
      <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.01s" fill="freeze"/>
    </g>
    <rect x="410" y="302" width="11" height="20" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5;0.75;0.75;1" dur="1.1s" begin="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
